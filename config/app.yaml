# Application configuration (non-secret). Secrets live in .env.
collection:
  adapter: mock            # mock | import | apify | playwright
  period_days: 30          # 7 | 10 | 30 | 60 | 90
  allow_scraping: false    # playwright adapter guard — see .env.example note
  apify:                   # only used when adapter: apify (token from APIFY_TOKEN env)
    base_url: https://api.apify.com/v2
    profile_actor: dev_fusion/linkedin-company-detail
    posts_actor: apimaestro/linkedin-company-posts
    posts_limit: 200

llm:
  batch_size: 10           # posts per classification call (quota economy)

engagement:
  weights:
    reactions: 1
    comments: 2
    reposts: 3

analysis:                  # EPIC-04 ranking sizes
  top_posts: 20
  top_posts_per_competitor: 5

campaigns:                 # EPIC-04 campaign detection
  window_days: 30          # posts in one campaign must fall inside this span
  min_posts: 3             # a theme needs at least this many posts to be a campaign

cross:                     # EPIC-05 thresholds
  min_posts_per_cell: 3
  emerging_keyword_growth: 2.0

loop:                      # EPIC-08 thresholds
  emerging_keyword_growth: 2.0
  refresh_shift_threshold: 3
