# Model roster per tier and provider. Free model IDs rotate — edit here, never in code.
# Provider order below IS the fallback order.
provider_order: [openrouter, nvidia, groq]

providers:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    rpm: 20
  nvidia:
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: NVIDIA_API_KEY
    rpm: 40
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    rpm: 30

# Rosters below were probed live on 2026-08-27 with a real chat + JSON call against
# each key in .env. Only models that returned valid JSON on repeated calls are listed.
# Groq is the most reliable/fastest tier today; OpenRouter :free slugs get 429'd under
# load, so each tier keeps NVIDIA + Groq behind them.
tiers:
  fast:
    openrouter: ["nvidia/nemotron-3-super-120b-a12b:free", "minimax/minimax-m3:free", "google/gemma-4-31b-it:free"]
    nvidia: ["nvidia/nemotron-3-nano-30b-a3b", "openai/gpt-oss-20b"]
    groq: ["openai/gpt-oss-20b", "openai/gpt-oss-120b", "qwen/qwen3.8-27b"]
  reasoning:
    openrouter: ["nvidia/nemotron-3-super-120b-a12b:free", "minimax/minimax-m3:free"]
    nvidia: ["deepseek-ai/deepseek-v4-pro-0813", "openai/gpt-oss-20b"]
    groq: ["openai/gpt-oss-120b", "qwen/qwen3.8-27b"]
