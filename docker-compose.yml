services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Works out of the box with the deterministic fake LLM. Add real keys via a
      # .env file (uncomment env_file below) to use the live provider chain.
      LLM_FAKE_MODE: "true"
      DATABASE_URL: "sqlite:///data/app.db"
      LOG_LEVEL: "INFO"
    # env_file:
    #   - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
